<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>AI Memory Vault</h1>
        </div>
        <span id="connectionDot" class="dot"></span>
      </header>
      <p id="status" class="status-line">Ready.</p>

      <section class="choice-grid">
        <button id="showSaveFlow">Save Memory</button>
        <button id="showUseFlow">Use Vault</button>
        <button id="showSettingsFlow" class="secondary">Options</button>
      </section>

      <section id="authPanel" class="panel">
        <h2>Create account or sign in</h2>
        <label>Email<input id="email" type="email" placeholder="you@example.com" /></label>
        <label>Password<input id="password" type="password" placeholder="Type password" /></label>
        <div class="row">
          <button id="signUp">Create account</button>
          <button id="signIn" class="secondary">Sign in</button>
        </div>
        <button id="resetPassword" class="secondary">Forgot password?</button>
      </section>

      <section id="vaultPanel" class="panel hidden">
        <div class="account-row">
          <span id="accountStatus" class="meta">Signed in</span>
          <button id="signOut" class="secondary">Sign out</button>
          <label>Secret code<input id="passphrase" type="password" placeholder="Secret code" /></label>
        </div>
      </section>

      <section id="saveFlow" class="panel flow-panel hidden">
        <h2>Save Chat</h2>
        <p class="meta">Chat text is read only when you preview or save. Saved content is encrypted locally before storage.</p>
        <button id="extractChat">Preview current chat</button>
        <label>Chat name<input id="chatTitle" placeholder="Example: Project planning chat" /></label>
        <textarea id="chatPreview" placeholder="Conversation preview appears here before anything is sent."></textarea>
        <button id="saveFullChat">Save chat</button>
        <button id="generateSuggestions">Generate memory suggestions</button>
        <h2>Suggested Memories</h2>
        <div id="suggestions"></div>
      </section>

      <section id="useFlow" class="panel flow-panel hidden">
        <div class="mode-switch">
          <button id="showSearchMode">Search Vault</button>
          <button id="showSavedChatsMode" class="secondary">Saved Chats</button>
        </div>
        <section id="searchMode" class="mode-panel">
          <div class="search-row">
            <input id="searchQuery" placeholder="Search memories" />
            <button id="searchVault">Search</button>
          </div>
          <div id="searchResults"></div>
        </section>
        <section id="savedChatsMode" class="mode-panel hidden">
          <button id="loadSavedChats" class="secondary">Show saved chats</button>
          <div id="savedChats"></div>
        </section>
        <p id="contextHelp" class="meta hidden">Context is large, so copy it and paste it into the AI chat.</p>
        <textarea id="contextText" class="hidden" placeholder="Generated context text appears here."></textarea>
        <button id="copyContext" class="secondary hidden">Copy context text</button>
      </section>

      <section id="settingsFlow" class="panel hidden">
        <h2>Options</h2>
        <label class="provider-setting">Vault service URL<input id="supabaseUrl" placeholder="https://vault.example.com" /></label>
        <label class="provider-setting">Vault service key<input id="supabaseAnonKey" placeholder="key" /></label>
        <label>Max memories<input id="maxMemories" type="number" min="1" max="10" value="5" /></label>
        <label>Default source
          <select id="defaultSource">
            <option value="browser_extension">browser_extension</option>
            <option value="chatgpt">chatgpt</option>
            <option value="claude">claude</option>
            <option value="gemini">gemini</option>
            <option value="copilot">copilot</option>
          </select>
        </label>
        <label class="check"><input id="autoApprove" type="checkbox" /> Auto-approve new memories</label>
        <button id="checkStatus" class="secondary">Check connection</button>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="sidebar_supabase.js"></script>
  </body>
</html>
